name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; jobs opt into what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: Audit workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keeps the pins above honest: zizmor rejects an unpinned action, and
      # checks that each pinned commit really is the release it claims to be.
      - name: Run zizmor
        run: pipx run zizmor==1.29.0 --persona=auditor .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

  build:
    name: Build for ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # Both targets are worth seeing; one failing should not hide the other.
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The manifest is written once with `chromium:` and `firefox:` prefixes,
      # so only a real build per target says whether both still come out.
      - name: Build
        run: pnpm "build:$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The e2e suite drives a real browser; the unit suite does not need one,
      # but both run in the same job so the extension is only built once.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test
